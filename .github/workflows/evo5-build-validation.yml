name: EVOLUTION-05 Build Validation

on:
  push:
    branches:
      - evo5-build-validation

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-validation-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8787
      NEXT_PUBLIC_EVENT_LIFECYCLE: pre_event
    steps:
      - name: Clone validation branch
        run: |
          git clone --depth 1 --branch evo5-build-validation https://github.com/smart01-bot/FRONTEND-TOURE-DE-ROTARY.git repo
          cd repo
          git rev-parse HEAD
      - name: Install and verify
        working-directory: repo
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run type-check
          npm run lint
          node scripts/check-evolution-boundaries.mjs || true
          npm run build
