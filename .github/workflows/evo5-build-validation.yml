name: EVOLUTION-05 Build Validation

on:
  push:
    branches:
      - evo5-build-validation

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-validation-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8787
      NEXT_PUBLIC_EVENT_LIFECYCLE: pre_event
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Boundary audit
        continue-on-error: true
        run: node scripts/check-evolution-boundaries.mjs
      - name: Production build
        run: npm run build
